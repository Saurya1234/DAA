<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Traffic Route Finder PRO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
<h1>Smart Traffic Route Finder PRO 🚦</h1>
<p>Graph Visualizer + Animated Shortest Path</p>

<div class="controls">
<select id="source">
<option>Home</option>
<option>Market</option>
<option>School</option>
<option>Hospital</option>
<option>BusStand</option>
<option>RailwayStation</option>
</select>

<select id="destination">
<option>Home</option>
<option>Market</option>
<option>School</option>
<option>Hospital</option>
<option>BusStand</option>
<option>RailwayStation</option>
</select>

<button onclick="startPath()">Find Route</button>
<button onclick="resetGraph()">Reset</button>
</div>

<div id="graph">
<div class="label d1">2 km</div>
<div class="label d2">4 km</div>
<div class="label d3">5 km</div>
<div class="label d4">6 km</div>
<div class="label d5">6 km</div>
<div class="label d6">2 km</div>

<div class="node" id="Home">Home</div>
<div class="node" id="Market">Market</div>
<div class="node" id="School">School</div>
<div class="node" id="Hospital">Hospital</div>
<div class="node" id="BusStand">BusStand</div>
<div class="node" id="RailwayStation">RailwayStation</div>

<div class="line l1"></div>
<div class="line l2"></div>
<div class="line l3"></div>
<div class="line l4"></div>
<div class="line l5"></div>
<div class="line l6"></div>

</div>

<div id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
